name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security
        vulnerabilities — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The route definition, the request, and the response you got.
      placeholder: |
        Route::get('/report', ...)->middleware('x402:0.01');

        curl -i http://localhost:8000/report
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `php artisan x402:doctor`
      description: Redact your wallet address if you prefer.
      render: text
    validations:
      required: false

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: 12.4.1
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.6
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [enforce, observe, off]
    validations:
      required: true

  - type: dropdown
    id: settlement
    attributes:
      label: Settlement mode
      options: [before_response, after_response]
    validations:
      required: true

  - type: input
    id: facilitator
    attributes:
      label: Facilitator
      placeholder: https://x402.org/facilitator
    validations:
      required: false

  - type: input
    id: network
    attributes:
      label: Network
      placeholder: eip155:84532
    validations:
      required: false
