name: Example agent

on:
  push:
    branches: [main]
    paths: ['examples/agent/**', '.github/workflows/example-agent.yml']
  pull_request:
    paths: ['examples/agent/**', '.github/workflows/example-agent.yml']

jobs:
  typecheck:
    runs-on: ubuntu-latest

    # The example agent uses the official x402 TypeScript client. Typechecking
    # it against the real packages is how we find out that the protocol's
    # client API changed under us.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: examples/agent
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: examples/agent
        run: npx tsc --noEmit
